name: 功能请求 / Feature request
description: 提出新能力或改进。v1 范围已冻结（ADR-060），新功能需要维护者评估后才可能排期。
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue 与 [Discussions](https://github.com/StarryEmber/Curve-Almanac/discussions)，
        并阅读[已知限制与范围](https://github.com/StarryEmber/Curve-Almanac/blob/main/docs/ROADMAP.md)。

        v1 功能范围已冻结（ADR-060），任何 v2 设想都只是**未批准的提案**。说清场景比“我想要某个
        按钮”更有帮助。中英文均可 / Chinese or English are both welcome.

  - type: dropdown
    id: area
    attributes:
      label: 相关部分 / Area
      options:
        - 数据表与编辑 / Tables and editing
        - 图表 / Charts
        - 表格样式与条件格式 / Styling
        - 工作区、保存与导入导出 / Workspace and files
        - 插件与扩展 / Plugins
        - 界面、快捷键与设置 / UI, shortcuts, settings
        - 文档与手册 / Documentation
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / Problem
      description: 描述真实场景、现在的做法与卡点；可附示例数据（请脱敏）。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposal
      description: 你希望应用怎么表现？如涉及界面，可附草图或截图。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 现在如何绕过？其它工具是怎么解决的？
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: 预估影响面 / Estimated impact
      description: 是否可能触及数据格式、IPC 或依赖？不确定就选“不确定”。
      options:
        - 不确定 / Not sure
        - 仅界面与文案 / UI only
        - 涉及持久化或 formatVersion / Persistence
        - 涉及 IPC 或安全边界 / IPC or security
        - 涉及新的运行时依赖 / New dependency
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认 / Checklist
      options:
        - label: 我已搜索现有 issue 与 Discussions，未找到相同请求。
          required: true
        - label: 我已阅读 `docs/ROADMAP.md`，理解 v1 范围冻结、新功能需维护者评估。
          required: true
        - label: 维护者确认方向后，我愿意提交 Pull Request。
          required: false
