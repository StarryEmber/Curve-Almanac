# CI — Curve Almanac commit gate

# 门禁定义见 TESTPLAN §1 / ADR-014：
#   - L1–L3（lint / dependencies / typecheck / test+coverage / build）在 Windows 与 Linux 上都要过；
#   - L4 E2E 只在 Windows runner 跑（Electron 需要真实桌面会话），失败时上传 trace 与截图；
#   - 覆盖率阈值在 vitest.config.ts，低于阈值本工作流必须失败，不得下调阈值来变绿。
name: CI

on:
  # 纯文档提交不再触发全量质量门禁（Windows E2E 在 docs-only 提交上失败过多次）。
  # 注意：若以后给 main 加 branch protection 并把 CI 设为 required check，跳过整个
  # workflow 会让 check 一直 pending；那时应只对 push 用 paths-ignore，PR 侧改用
  # job 级 `if` 跳过 e2e/bench。
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pinned `packageManager` field (pnpm@11.28.5).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint (zero warnings) + dependency-cruiser boundary rules (ADR-017).
      - name: Lint
        run: pnpm lint

      # CONTRIBUTING §5 requires formatting checks; CI never ran this before T9.
      - name: Format check
        run: pnpm format:check

      # Markdown relative links/images (scripts/check-doc-links.mjs, T6). Docs are
      # excluded from prettier, so this is the only automated gate on the docs tree.
      - name: Doc link check
        run: pnpm docs:links

      - name: Typecheck
        run: pnpm typecheck

      # Coverage gate: thresholds live in vitest.config.ts and must not be
      # lowered. A regression below them fails this step and the job.
      - name: Test with coverage gate
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  # T2.7: hard SPEC §16.1 budgets + soft 20% regression annotation. The job runs
  # the pure pipelines only (no Electron), so it shares the Windows runner class
  # the committed baseline must be generated on; `bench/report.json` is uploaded
  # every run, and `bench/summary.md` lands in the job summary.
  bench:
    name: Bench (windows-latest)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm bench` exits non-zero when a gated P95 exceeds its budget and
      # prints `::warning` annotations for >20% regressions vs bench/baseline.json.
      - name: Run benchmarks
        run: pnpm bench

      - name: Append benchmark summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path bench/summary.md) {
            Get-Content bench/summary.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench/report.json
          if-no-files-found: warn
          retention-days: 30

  e2e:
    name: E2E (windows-latest)
    # E2E is the slowest gate; only spend it once lint/typecheck/test/build pass.
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The hosted runner starts at 1024x768; the app's default 1440x900 window
      # would be clamped and layout/zoom E2E assertions would see a tiny
      # viewport. Give the app the same desktop size as a developer machine.
      - name: Set display resolution
        shell: pwsh
        run: |
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -ErrorAction Stop
            Write-Host "Display resolution set to 1920x1080"
          } catch {
            Write-Warning "Could not set display resolution: $($_.Exception.Message)"
          }

      # `pnpm e2e` builds the app and then drives it with Playwright `_electron`.
      # Never pass `--no-sandbox` here: that flag is an agent-shell workaround
      # (CURVE_E2E_NO_SANDBOX) and must not leak into CI or the app.
      - name: Build and run Electron E2E
        run: pnpm e2e

      # playright.config.ts keeps trace/screenshot only for failures, and
      # e2e/fixtures.ts attaches them to the report as well.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 7
