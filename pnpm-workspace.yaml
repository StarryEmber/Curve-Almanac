packages:
  - apps/*
  - packages/*
  - plugins/*

# Explicit allowlist for dependency install scripts. pnpm blocks all build
# scripts by default; only the packages below may run theirs.
# - electron: downloads the desktop runtime binary (T0.2)
# - esbuild / unrs-resolver: native binaries used by the toolchain
allowBuilds:
  electron: true
  esbuild: true
  unrs-resolver: true
  # electron-builder (T0.2 devDependency, first used in T6.4) pulls
  # electron-winstaller for Squirrel.Windows. v1 ships an NSIS installer, so its
  # postinstall is not needed; declaring it false keeps the policy explicit
  # instead of silently dropping it from the allowlist.
  electron-winstaller: false
